<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFITUM — Задания в Кишиневе</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-gray-800">

<header class="bg-white/90 backdrop-blur-md shadow-sm border-b sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="bg-gradient-to-tr from-amber-500 to-emerald-600 text-white p-2 rounded-lg font-bold text-xl flex items-center justify-center w-9 h-9 shadow-md">
                <i class="fa-solid fa-gem"></i>
            </div>
            <div>
                <span class="font-black text-lg tracking-wider text-gray-900">PROFIT<span class="text-emerald-600">UM</span></span>
                <span class="block text-[10px] text-emerald-800 font-semibold">CHISINAU</span>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <select id="lang-switcher" onchange="changeLanguage(this.value)" class="bg-gray-100 border border-gray-200 text-gray-700 text-xs font-bold rounded-lg px-2 py-1.5 focus:outline-none cursor-pointer">
                <option value="ru">🇷🇺 RU</option>
                <option value="ro">🇲🇩 RO</option>
                <option value="en">🇬🇧 EN</option>
                <option value="it">🇮🇹 IT</option>
            </select>

            <button onclick="alert('Создание задания')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-2 rounded-lg text-xs transition flex items-center shadow-sm">
                <i class="fa-solid fa-plus mr-1"></i><span data-i18n="createBtn">Создать</span>
            </button>
        </div>
    </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
    <div class="space-y-6">
        <div class="bg-gradient-to-r from-amber-500/10 via-emerald-500/10 to-amber-500/10 p-4 rounded-xl border border-amber-200/60 shadow-sm flex items-center justify-between">
            <div>
                <span class="bg-amber-500 text-white text-xs px-2 py-0.5 rounded font-bold">PRO 👑</span>
                <h4 class="font-bold text-gray-900 text-sm mt-1" data-i18n="proTitle">Вы мастер в Кишиневе?</h4>
                <p class="text-xs text-gray-600" data-i18n="proDesc">Подключите PRO-аккаунт (199 MDL) для доступа к заказам!</p>
            </div>
            <button onclick="alert('PRO статус')" class="bg-amber-500 text-white text-xs font-bold px-3 py-2 rounded-lg whitespace-nowrap">
                <span data-i18n="proBtn">Подключить</span>
            </button>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex gap-3">
            <input type="text" id="search-input" onkeyup="filterTasks()" placeholder="Поиск по заданиям..." data-i18n-placeholder="searchPlaceholder" class="w-full px-3 py-2 border rounded-lg text-sm border-gray-200 focus:outline-none">
            <select id="filter-district" onchange="filterTasks()" class="border rounded-lg text-sm px-3 py-2 bg-white border-gray-200">
                <option value="">Все секторы</option>
                <option value="Центр (Centru)">Центр (Centru)</option>
                <option value="Рышкановка (Râșcani)">Рышкановка (Râșcani)</option>
                <option value="Ботаника (Botanica)">Ботаника (Botanica)</option>
                <option value="Чеканы (Ciocana)">Чеканы (Ciocana)</option>
                <option value="Буюканы (Buiucani)">Буюканы (Buiucani)</option>
            </select>
        </div>

        <div id="tasks-container" class="space-y-4"></div>
    </div>
</main>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); }

    let tasksList = [
        { id: 1, title: "Починить смеситель в ванной", category: "Бытовой ремонт", district: "Центр (Centru)", price: 300, desc: "Нужно заменить картридж." },
        { id: 2, title: "Генеральная уборка квартиры 2к", category: "Уборка", district: "Ботаника (Botanica)", price: 800, desc: "Влажная уборка всех комнат." }
    ];

    const translations = {
        ru: { createBtn: "Создать", searchPlaceholder: "Поиск по заданиям...", proTitle: "Вы мастер в Кишиневе?", proDesc: "Подключите PRO-аккаунт (199 MDL) для доступа к заказам!", proBtn: "Подключить" },
        ro: { createBtn: "Creează", searchPlaceholder: "Caută sarcini...", proTitle: "Ești meșter în Chișinău?", proDesc: "Activează contul PRO (199 MDL) pentru comenzi!", proBtn: "Activează" },
        en: { createBtn: "Create", searchPlaceholder: "Search tasks...", proTitle: "Are you a master in Chisinau?", proDesc: "Activate PRO account (199 MDL) for orders!", proBtn: "Activate" },
        it: { createBtn: "Crea", searchPlaceholder: "Cerca compiti...", proTitle: "Sei un professionista a Chișinău?", proDesc: "Attiva l'account PRO (199 MDL) per gli ordini!", proBtn: "Attiva" }
    };

    function changeLanguage(lang) {
        const t = translations[lang] || translations.ru;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.textContent = t[key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (t[key]) el.placeholder = t[key];
        });
        renderTasks(tasksList);
    }

    function renderTasks(tasks) {
        const container = document.getElementById('tasks-container');
        container.innerHTML = tasks.map(item => `
            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-2">
                <div class="flex justify-between items-start">
                    <h3 class="font-bold text-gray-900">${item.title}</h3>
                    <span class="font-bold text-emerald-600 text-sm">${item.price} MDL</span>
                </div>
                <p class="text-xs text-gray-600">${item.desc}</p>
                <div class="flex justify-between items-center text-xs text-gray-500 pt-2 border-t border-gray-50">
                    <span>📍 ${item.district}</span>
                    <span class="bg-slate-100 px-2 py-1 rounded text-gray-600">${item.category}</span>
                </div>
            </div>
        `).join('');
    }

    function filterTasks() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const district = document.getElementById('filter-district').value;
        const filtered = tasksList.filter(item => 
            (item.title.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query)) &&
            (!district || item.district === district)
        );
        renderTasks(filtered);
    }

    renderTasks(tasksList);
</script>
</body>
</html>
