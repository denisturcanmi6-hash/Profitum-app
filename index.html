<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profitum Chisinau - Premium & Runes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .rune-pattern {
            background-image: radial-gradient(circle, rgba(212, 175, 55, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
        }
    </style>
</head>
<body class="bg-[#090a0f] text-slate-200 antialiased min-h-screen flex flex-col rune-pattern pb-8">

    <!-- Премиальная шапка -->
    <header class="bg-[#0e1017]/90 backdrop-blur-md border-b border-amber-500/10 sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-br from-amber-400 to-amber-700 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-amber-950/40 text-slate-950 font-black">
                ᚛⚡᚜
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="font-bold text-sm tracking-widest text-amber-300">PROFITUM</h1>
                    <span class="text-[9px] bg-amber-400/10 text-amber-400 px-1.5 py-0.5 rounded-md font-semibold border border-amber-400/20">VIP %</span>
                </div>
                <p class="text-[10px] text-slate-400 tracking-wider">CHISINAU • RUNES SYSTEM</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span class="text-xs bg-[#151821] text-slate-300 px-2.5 py-1 rounded-lg border border-slate-800">🇷🇺 RU</span>
            <button onclick="openCreateModal()" class="bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold text-xs px-3.5 py-2 rounded-xl shadow-lg shadow-amber-500/20 hover:opacity-90 active:scale-95 transition">+ Создать</button>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="flex-1 p-4 max-w-lg mx-auto w-full space-y-4">
        
        <!-- Рунический статус-блок -->
        <div class="bg-gradient-to-br from-[#12151d] to-[#0c0e14] border border-amber-500/20 p-4 rounded-2xl shadow-2xl relative overflow-hidden">
            <div class="absolute -right-3 -bottom-3 text-6xl opacity-5 select-none text-amber-400">ᚠ</div>
            <div class="flex justify-between items-center mb-1">
                <span class="text-xs text-slate-400 font-medium tracking-wide">Рунический баланс & Статус</span>
                <span class="text-amber-400 text-xs font-semibold bg-amber-400/10 px-2 py-0.5 rounded-md border border-amber-400/20">VIP Boost Active</span>
            </div>
            <div class="text-2xl font-black text-amber-300 tracking-tight">0.00 MDL</div>
        </div>

        <!-- Быстрая связь -->
        <div class="bg-[#12151d] border border-slate-800/80 p-3.5 rounded-2xl flex items-center justify-between shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-amber-500/10 flex items-center justify-center text-amber-400 text-sm border border-amber-500/20">📞</div>
                <div>
                    <div class="text-xs font-semibold text-slate-200">Прямая связь с поддержкой</div>
                    <div class="text-[10px] text-slate-400">Оперативный отклик в Кишиневе</div>
                </div>
            </div>
            <a href="https://t.me/your_support_username" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-medium px-3 py-1.5 rounded-xl border border-slate-700 transition">Связаться</a>
        </div>

        <!-- Фильтры и поиск по секторам -->
        <div class="space-y-2">
            <input type="text" id="searchInput" oninput="filterTasks()" placeholder="Поиск по заданиям..." 
                class="w-full bg-[#12151d] border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500/50 shadow-inner">
            <select id="sectorFilter" onchange="filterTasks()" class="w-full bg-[#12151d] border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-300 focus:outline-none focus:border-amber-500/50 appearance-none cursor-pointer">
                <option value="">Все секторы Кишинева</option>
                <option value="Centru">Centru</option>
                <option value="Botanica">Botanica</option>
                <option value="Buiucani">Buiucani</option>
                <option value="Ciocana">Ciocana</option>
                <option value="Riscani">Riscani</option>
            </select>
        </div>

        <!-- Список заданий из Supabase -->
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Доступные задания</h2>
                <span class="text-[10px] text-amber-400/70">⚡ Синапс Supabase активен</span>
            </div>
            
            <div id="tasks-container" class="space-y-3">
                <div class="text-center py-12 text-slate-500 text-xs bg-[#12151d]/60 rounded-2xl border border-slate-800/60">
                    ⚡ Синхронизация рунических потоков...
                </div>
            </div>
        </div>
    </main>

    <!-- Модальное окно создания задания -->
    <div id="createModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#12151d] border border-amber-500/20 rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-sm text-amber-300">⚡ Новое задание (Runes)</h3>
                <button onclick="closeCreateModal()" class="text-slate-400 hover:text-slate-200 text-lg">✕</button>
            </div>

            <form id="createTaskForm" onsubmit="handleCreateTask(event)" class="space-y-3">
                <div>
                    <label class="text-[11px] font-semibold text-slate-400 block mb-1">Название работы</label>
                    <input type="text" id="taskTitle" required placeholder="Напр: Починить смеситель" class="w-full bg-[#090a0f] border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] font-semibold text-slate-400 block mb-1">Оплата (MDL)</label>
                        <input type="number" id="taskPrice" required placeholder="500" class="w-full bg-[#090a0f] border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="text-[11px] font-semibold text-slate-400 block mb-1">Сектор</label>
                        <select id="taskSector" class="w-full bg-[#090a0f] border border-slate-800 rounded-xl px-2 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                            <option value="Centru">Centru</option>
                            <option value="Botanica">Botanica</option>
                            <option value="Buiucani">Buiucani</option>
                            <option value="Ciocana">Ciocana</option>
                            <option value="Riscani">Riscani</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-semibold text-slate-400 block mb-1">Описание задачи</label>
                    <textarea id="taskDesc" rows="3" placeholder="Детали заказа..." class="w-full bg-[#090a0f] border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:opacity-90 text-slate-950 font-bold text-xs py-3 rounded-xl shadow-lg shadow-amber-500/20 transition">
                    Опубликовать в базу Supabase
                </button>
            </form>
        </div>
    </div>

    <!-- Скрипты и логика -->
    <script>
        const SUPABASE_URL = "https://xudwyqmpucmqgjjpbgll.supabase.co";
        const SUPABASE_ANON_KEY = "Sb_publishable_dxJStXW9jVQ4XUZE_J5Umw_jNr2Vw8h";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); }

        let allTasks = [];

        function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); }
        function closeCreateModal() { document.getElementById('createModal').classList.add('hidden'); }

        function renderTasks(tasks) {
            const container = document.getElementById('tasks-container');
            if (!tasks || tasks.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-500 text-xs bg-[#12151d]/60 rounded-2xl border border-slate-800/60">
                        ⚡ Активных заданий в системе пока нет
                    </div>`;
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="bg-[#12151d] border border-slate-800/80 p-4 rounded-2xl shadow-md hover:border-amber-500/30 transition space-y-3">
                    <div class="flex justify-between items-start">
                        <h3 class="font-semibold text-sm text-slate-200">${task.title || 'Задание'}</h3>
                        <span class="text-amber-400 font-bold text-sm bg-amber-400/10 px-2 py-0.5 rounded-lg border border-amber-400/20">${task.price || 0} MDL</span>
                    </div>
                    <p class="text-xs text-slate-400">${task.desc || task.description || ''}</p>
                    <div class="flex justify-between items-center text-[11px] text-slate-500 pt-2.5 border-t border-slate-800/60">
                        <div class="flex items-center space-x-2">
                            <span>👤 ${task.client || 'VIP Клиент'}</span>
                            <span class="text-amber-400 font-semibold">⭐ ${task.rating || '5.0'}</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="bg-amber-400/10 text-amber-300 px-2 py-0.5 rounded-md font-medium text-[10px] border border-amber-400/20">👑 На месте</span>
                            <span class="font-medium text-slate-300">📍 ${task.district || 'Centru'}</span>
                        </div>
                    </div>
                    <button onclick="alert('Отклик отправлен!')" class="w-full bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-amber-300 text-xs font-semibold py-2 rounded-xl transition">
                        ⚡ Откликнуться на заказ
                    </button>
                </div>
            `).join('');
        }

        function filterTasks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sector = document.getElementById('sectorFilter').value;

            const filtered = allTasks.filter(task => {
                const titleText = (task.title || '').toLowerCase();
                const descText = (task.desc || task.description || '').toLowerCase();
                const matchesQuery = titleText.includes(query) || descText.includes(query);
                const matchesSector = !sector || (task.district && task.district === sector);
                return matchesQuery && matchesSector;
            });

            renderTasks(filtered);
        }

        async function fetchTasks() {
            try {
                const { data, error } = await supabaseClient
                    .from('tasks')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error("Ошибка Supabase:", error);
                    allTasks = [];
                    renderTasks([]);
                    return;
                }

                allTasks = data || [];
                renderTasks(allTasks);
            } catch (err) {
                console.error("Сетевая ошибка:", err);
                allTasks = [];
                renderTasks([]);
            }
        }

        async function handleCreateTask(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Сохранение...";
            btn.disabled = true;

            const newTask = {
                title: document.getElementById('taskTitle').value,
                price: parseFloat(document.getElementById('taskPrice').value),
                district: document.getElementById('taskSector').value,
                desc: document.getElementById('taskDesc').value,
                client: tg?.initDataUnsafe?.user?.first_name || "VIP Мастер",
                rating: "5.0"
            };

            try {
                const { error } = await supabaseClient
                    .from('tasks')
                    .insert([newTask]);

                if (error) {
                    alert("Ошибка: " + error.message);
                } else {
                    closeCreateModal();
                    document.getElementById('createTaskForm').reset();
                    fetchTasks();
                }
            } catch (err) {
                alert("Ошибка: " + err.message);
            } finally {
                btn.innerText = "Опубликовать в базу Supabase";
                btn.disabled = false;
            }
        }

        fetchTasks();
    </script>
</body>
</html>
