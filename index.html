<script>
    // --- НАСТРОЙКА SUPABASE ---
    const SUPABASE_URL = "https://xudwyqmpucmqgjjpbgll.supabase.co";
    const SUPABASE_ANON_KEY = "Sb_publishable_dxJStXW9jVQ4XUZE_J5Umw_jNr2Vw8h";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); }

    let currentLang = 'ru';
    let tasksList = [];

    // Безопасная загрузка задач из Supabase
    async function fetchTasks() {
        const container = document.getElementById('tasks-container');
        try {
            const { data, error } = await supabaseClient
                .from('tasks')
                .select('*');

            if (error) {
                console.error("Ошибка Supabase:", error);
                tasksList = [];
                renderTasks(tasksList);
                return;
            }

            tasksList = data || [];
            renderTasks(tasksList);
        } catch (err) {
            console.error("Сетевая ошибка:", err);
            tasksList = [];
            renderTasks(tasksList);
        }
    }

    // Запускаем загрузку задач при открытии страницы
    fetchTasks();
</script>
